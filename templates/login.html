<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CFC Gestão - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>

    <div class="container login-wrapper">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-4">
                <div class="card login-card p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="brand-icon">
                            <i class="bi bi-car-front-fill"></i>
                        </div>
                        <h2 class="brand-title fs-3">CFC Gestão</h2>
                        <p class="brand-subtitle">Faça login para continuar</p>
                    </div>

                    {% with messages = get_flashed_messages(with_categories=true) %}
                      {% if messages %}
                        {% for category, message in messages %}
                          <div class="alert alert-{{ category }} alert-dismissible fade show border-0 shadow-sm" role="alert">
                            <i class="bi bi-info-circle me-1"></i> {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                          </div>
                        {% endfor %}
                      {% endif %}
                    {% endwith %}

                    <form action="{{ url_for('auth.login') }}" method="POST" id="loginForm">
                        <div class="mb-3 form-group-anim">
                            <label for="username" class="form-label">Usuário</label>
                            <div class="input-group-custom">
                                <input type="text" name="username" class="form-control" id="username" placeholder="Seu usuário" required autocomplete="username">
                                <i class="bi bi-person-fill input-icon"></i>
                            </div>
                        </div>

                        <div class="mb-4 form-group-anim">
                            <label for="password" class="form-label">Senha</label>
                            <div class="input-group-custom">
                                <input type="password" name="password" class="form-control" id="password" placeholder="••••••••" required autocomplete="current-password">
                                <i class="bi bi-lock-fill input-icon"></i>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mb-3 form-group-anim" id="loginBtn">
                            <span class="btn-spinner"></span>
                            <span class="btn-text">Entrar no Sistema</span>
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <a href="#" class="text-decoration-none forgot-link">Esqueceu a senha?</a>
                    </div>
                </div>
                <p class="text-center mt-4 footer-text">
                    <small class="text-white-50">&copy; 2026 CFC Gestão — Omega_Dev's</small>
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.classList.add('loading');
        });
    </script>
</body>
</html>
